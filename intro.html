<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#db2426">
<title>بيتزا الإسراء</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#db2426;
    background:radial-gradient(circle at 50% 38%, #e53234 0%, #db2426 55%, #b91d1f 100%);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .intro-logo {
    width:min(86vw, 340px);
    height:auto;
    opacity:0;
    transform:scale(.55);
    animation:logo-pop 1s cubic-bezier(.2,1.4,.4,1) .15s forwards, logo-float 3.2s ease-in-out 1.3s infinite;
    filter:drop-shadow(0 18px 34px rgba(0,0,0,.35));
  }
  @keyframes logo-pop {
    to { opacity:1; transform:scale(1); }
  }
  @keyframes logo-float {
    0%,100% { transform:scale(1) translateY(0); }
    50%     { transform:scale(1.02) translateY(-8px); }
  }
  .intro-glow {
    position:absolute;
    width:min(92vw, 400px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 65%);
    opacity:0;
    animation:glow-in 1.2s ease .5s forwards, glow-pulse 2.6s ease-in-out 1.7s infinite;
    pointer-events:none;
  }
  @keyframes glow-in { to { opacity:1; } }
  @keyframes glow-pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .intro-phrase {
    margin-top:26px;
    font-size:clamp(19px, 5.4vw, 26px);
    font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,.25);
    opacity:0;
    transform:translateY(18px);
    animation:rise .7s ease-out 1.05s forwards;
    text-align:center;
    padding:0 20px;
  }
  .intro-btn {
    margin-top:34px;
    background:#fff;
    color:#b91d1f;
    font-size:18px;
    font-weight:900;
    font-family:inherit;
    border:none;
    border-radius:999px;
    padding:14px 44px;
    min-height:48px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.28);
    opacity:0;
    transform:translateY(18px);
    animation:rise .7s ease-out 1.7s forwards, btn-pulse 1.8s ease-in-out 2.6s infinite;
  }
  .intro-btn:active { transform:scale(.96); }
  @keyframes rise { to { opacity:1; transform:translateY(0); } }
  @keyframes btn-pulse {
    0%,100% { box-shadow:0 10px 24px rgba(0,0,0,.28); }
    50%     { box-shadow:0 10px 32px rgba(0,0,0,.4), 0 0 0 10px rgba(255,255,255,.12); }
  }
  .intro-progress {
    position:fixed;
    bottom:0;
    right:0;
    height:4px;
    width:0;
    background:rgba(255,255,255,.85);
    animation:fill 4.6s linear 1.4s forwards;
  }
  @keyframes fill { to { width:100%; } }
  body.leaving { animation:fade-out .45s ease forwards; }
  @keyframes fade-out { to { opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    .intro-logo, .intro-glow, .intro-phrase, .intro-btn { animation-duration:.01s !important; animation-delay:0s !important; }
    .intro-progress { animation-duration:2s !important; animation-delay:.3s !important; }
  }
</style>
</head>
<body>
  <div class="intro-glow"></div>
  <img class="intro-logo" src="logo.jpg" alt="بيتزا الإسراء - ألذ عجينة في مصر">
  <p class="intro-phrase">ألذ لحظة في يومك تبدأ من هنا 🍕</p>
  <button class="intro-btn" type="button">افتح المنيو</button>
  <div class="intro-progress"></div>
<script>
  var went = false;
  function go(){
    if (went) return;
    went = true;
    document.body.classList.add('leaving');
    setTimeout(function(){ location.replace('index.html'); }, 420);
  }
  document.body.addEventListener('click', go);
  setTimeout(go, 6000);
</script>
</body>
</html>
