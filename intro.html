<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>بيتزا الإسراء</title>
<style>
  @property --a { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#050505;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    color:#fff;
  }
  .app {
    position:fixed;
    inset:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    background:radial-gradient(circle at 50% 42%, #171010 0%, #050505 62%);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .intro-stage { position:relative; }
  .intro-glow {
    position:absolute;
    inset:-70px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(219,36,38,.42) 0%, rgba(219,36,38,0) 62%);
    filter:blur(10px);
    opacity:0;
    animation:glow-in 1.4s ease 1.2s forwards, glow-pulse 3.2s ease-in-out 2.6s infinite;
    pointer-events:none;
  }
  @keyframes glow-in { to { opacity:1; } }
  @keyframes glow-pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.06);opacity:.8;} }
  .intro-frame {
    position:relative;
    padding:3px;
    border-radius:26px;
  }
  .intro-frame::before {
    content:'';
    position:absolute;
    inset:0;
    border-radius:26px;
    padding:2px;
    background:conic-gradient(from var(--a),
      transparent 0deg 205deg,
      #ff7a1a 248deg,
      #ff2e2e 296deg,
      #ffffff 330deg,
      transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite:exclude;
    filter:drop-shadow(0 0 7px rgba(255,70,40,.85));
    animation:trace 1.8s cubic-bezier(.45,.05,.55,.95) 2, trace-slow 5s linear 3.6s infinite;
  }
  @keyframes trace { from { --a:0deg; } to { --a:360deg; } }
  @keyframes trace-slow { from { --a:0deg; } to { --a:360deg; } }
  .intro-card {
    position:relative;
    display:block;
    height:min(64dvh, 560px);
    width:auto;
    max-width:84vw;
    border-radius:22px;
    opacity:0;
    transform:scale(.85) translateY(10px);
    animation:card-in 1s cubic-bezier(.16,1,.3,1) 1s forwards;
  }
  @keyframes card-in { to { opacity:1; transform:scale(1) translateY(0); } }
  .intro-phrase {
    font-size:clamp(14px, 4vw, 17px);
    font-weight:600;
    letter-spacing:1.2px;
    color:rgba(245,240,234,.88);
    text-shadow:0 0 16px rgba(255,70,40,.35);
    opacity:0;
    transform:translateY(12px);
    animation:rise .8s cubic-bezier(.16,1,.3,1) 2s forwards;
    text-align:center;
    padding:0 24px;
  }
  @keyframes rise { to { opacity:1; transform:translateY(0); } }
  .app.leaving { animation:fade-out .5s ease forwards; }
  @keyframes fade-out { to { opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    .intro-frame::before, .intro-card, .intro-glow, .intro-phrase { animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="intro-stage">
      <div class="intro-glow"></div>
      <div class="intro-frame">
        <img class="intro-card" src="brand-card.jpg" alt="بيتزا الإسراء - ألذ عجينة في مصر - 15410">
      </div>
    </div>
    <p class="intro-phrase">ألذ لحظة في يومك تبدأ من هنا</p>
  </div>
<script>
  var went = false;
  function go(){
    if (went) return;
    went = true;
    document.getElementById('app').classList.add('leaving');
    setTimeout(function(){ location.replace('index.html'); }, 450);
  }
  document.getElementById('app').addEventListener('click', go);
  setTimeout(go, 5800);
</script>
</body>
</html>
